name: spend_trends
description: Personal spend trends with SimpleFIN bank sync
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  ethan_utils:
    path: ../ethan_utils
  ethan_sync:
    path: ../ethan_sync
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^3.0.0
  http: ^1.2.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.4
  path_provider: ^2.1.4
  path: ^1.9.0
  sqlite3: ^2.7.0
  sqlite3_flutter_libs: ^0.5.41
  uuid: ^4.5.1
  powersync: ^1.16.2
  file_picker: ^8.1.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  sqlite3_flutter_libs: 0.5.41
  powersync: 1.16.2
  path_provider_foundation: 2.5.1

flutter:
  config:
    # flutter_secure_storage_macos has no Package.swift yet; keep CocoaPods
    # until the plugin adopts SPM (Flutter 3.44+ defaults SPM on).
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - .env
    - assets/icon/

flutter_launcher_icons:
  android: false
  ios: true
  macos:
    generate: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png
